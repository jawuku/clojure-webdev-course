            rel="icon"

            rel="preload"
            href="/fonts/fraunces-latin-var.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />

            rel="preload"
            href="/fonts/ibm-plex-sans-latin-var.woff2"

             page never flashes the wrong theme while React boots. Mirrors the
             effectiveThemeKey logic in src/context/AppContext.jsx. This is a
             separate file, not an inline script, because the app is served
             under `script-src 'self'`. -->
