name: Desktop release

# Signing and notarization live here, not in desktop-ci.yml: pull-request CI has
# no certificates and must stay green. This workflow runs manually or from a
# `desktop-v*` tag and fails early, naming every missing secret, when the
# signing credentials are not configured.
#
# The Linux jobs are the exception: GPG signing is optional there. Without
# LINUX_GPG_PRIVATE_KEY_BASE64 they publish the package and its SHA256SUMS
# unsigned rather than failing, because checksums are useful without a key.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

env:
  LEIN_VERSION: "2.12.0"

jobs:
  uberjar:
    name: Uberjar (shared with Windows)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build uberjar
        run: lein uberjar

      - name: Upload uberjar
        uses: actions/upload-artifact@v7
        with:
          name: parens-uberjar
          path: desktop/target/parens-desktop.jar
          if-no-files-found: error

  macos-release:
    name: macOS signed + notarized .dmg
    runs-on: macos-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: desktop
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_KEY_ISSUER: ${{ secrets.APPLE_NOTARY_KEY_ISSUER }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Require signing secrets
        run: bash scripts/require_release_secrets.sh macos

      - name: Build app image
        env:
          APP_VERSION: "1.0.0"
        run: bash scripts/build_appimage.sh

      # Replaces the ad-hoc signature from build_appimage.sh with the Developer
      # ID identity and the hardened runtime.
      - name: Sign app bundle
        run: bash scripts/sign_macos.sh target/jpackage/ParensPhase0.app

      # The hardened runtime and the entitlements are the parts that can break
      # the child JVM, so exercise the signed app before notarizing it.
      - name: Check signed app
        run: >-
          node scripts/phase0_check.mjs
          --command "$(pwd)/target/jpackage/ParensPhase0.app/Contents/MacOS/ParensPhase0"
          --json "$RUNNER_TEMP/signed-macos-results.json"

      - name: Notarize and staple app
        run: bash scripts/notarize_macos.sh target/jpackage/ParensPhase0.app

      - name: Build .dmg
        env:
          APP_VERSION: "1.0.0"
          SKIP_APPIMAGE: "1"
        run: bash scripts/build_dmg.sh

      - name: Sign .dmg
        run: bash scripts/sign_macos.sh target/dmg/*.dmg

      - name: Notarize and staple .dmg
        run: bash scripts/notarize_macos.sh target/dmg/*.dmg

      - name: Upload .dmg
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parens-dmg-signed
          path: desktop/target/dmg/*.dmg
          if-no-files-found: ignore

      - name: Upload macOS release check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-results
          path: ${{ runner.temp }}/signed-macos-results.json
          if-no-files-found: ignore

  windows-release:
    name: Windows signed .msi + .exe
    needs: uberjar
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: desktop
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: parens-uberjar
          path: desktop/target

      - name: Require signing secrets
        shell: bash
        run: bash scripts/require_release_secrets.sh windows

      - name: Build app image
        shell: bash
        env:
          APP_VERSION: "1.0.0"
          REBUILD_JAR: "0"
        run: bash scripts/build_appimage.sh

      - name: Sign app-image launchers
        shell: bash
        run: >-
          bash scripts/sign_windows.sh
          target/jpackage/ParensPhase0/ParensPhase0.exe
          target/jpackage/ParensPhase0/ParensWorker.exe

      - name: Check signed app image
        shell: bash
        run: >-
          node scripts/phase0_check.mjs
          --command "target/jpackage/ParensPhase0/ParensPhase0.exe"
          --json "$RUNNER_TEMP/signed-windows-results.json"

      # jpackage rebuilds the app image for each installer, so the launchers
      # inside them are new copies; the installers themselves are signed below.
      - name: Build .msi
        shell: bash
        env:
          APP_VERSION: "1.0.0"
          REBUILD_JAR: "0"
        run: bash scripts/build_msi.sh

      - name: Build .exe
        shell: bash
        env:
          APP_VERSION: "1.0.0"
          REBUILD_JAR: "0"
        run: bash scripts/build_exe.sh

      - name: Sign installers
        shell: bash
        run: bash scripts/sign_windows.sh target/msi/*.msi target/exe/*.exe

      - name: Install signed .msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem target\msi\*.msi | Select-Object -First 1
          if (-not $msi) { throw 'no .msi found' }
          $log = Join-Path $env:RUNNER_TEMP 'msi-install.log'
          $p = Start-Process msiexec.exe -ArgumentList @(
            '/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/L*v', "`"$log`""
          ) -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            Get-Content $log -Tail 80
            throw "msiexec install failed ($($p.ExitCode))"
          }
          Write-Host "Installed $($msi.Name)"

      - name: Locate installed launcher
        id: installed
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:ProgramFiles 'ParensPhase0\ParensPhase0.exe'),
            (Join-Path $env:LOCALAPPDATA 'ParensPhase0\ParensPhase0.exe')
          )
          $deadline = (Get-Date).AddSeconds(90)
          do {
            $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($exe) { break }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)
          if (-not $exe) { throw 'installed ParensPhase0.exe not found' }
          $javaExe = Join-Path (Split-Path $exe) 'runtime\bin\java.exe'
          if (-not (Test-Path $javaExe)) {
            throw "installed runtime has no java.exe at $javaExe"
          }
          "exe=$($exe.Replace('\', '/'))" >> $env:GITHUB_OUTPUT
          Write-Host "Installed launcher: $exe"

      - name: Check installed app
        shell: bash
        run: >-
          node scripts/phase0_check.mjs
          --command "${{ steps.installed.outputs.exe }}"
          --json "$RUNNER_TEMP/release-msi-results.json"

      - name: Uninstall .msi
        if: always()
        shell: pwsh
        run: |
          $msi = Get-ChildItem target\msi\*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            $p = Start-Process msiexec.exe -ArgumentList @(
              '/x', "`"$($msi.FullName)`"", '/qn', '/norestart'
            ) -Wait -PassThru
            Write-Host "msiexec uninstall exit $($p.ExitCode)"
            $exe = '${{ steps.installed.outputs.exe }}'
            $deadline = (Get-Date).AddSeconds(60)
            while ($exe -and (Test-Path $exe) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 3
            }
            if ($exe -and (Test-Path $exe)) { throw "uninstall left $exe behind" }
          }

      - name: Upload signed installers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parens-windows-signed
          path: |
            desktop/target/msi/*.msi
            desktop/target/exe/*.exe
          if-no-files-found: ignore

      - name: Upload Windows release check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-results
          path: |
            ${{ runner.temp }}/signed-windows-results.json
            ${{ runner.temp }}/release-msi-results.json
          if-no-files-found: ignore

  linux-deb-release:
    name: Linux .deb + SHA256SUMS
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    env:
      LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
      LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install packaging prerequisites
        run: sudo apt-get update && sudo apt-get install -y binutils gnupg

      # Same build script CI validates by installing the package and running
      # phase0_check.mjs / offline_smoke.mjs against it.
      - name: Build .deb
        run: bash scripts/build_deb.sh

      - name: Inspect package
        run: dpkg-deb -I target/deb/*.deb

      - name: Publish package, checksums and optional signature
        run: bash scripts/publish_linux.sh target/deb/*.deb

      - name: Upload .deb release
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parens-deb-release
          path: desktop/target/dist/*
          if-no-files-found: ignore

  linux-rpm-release:
    name: Linux .rpm + SHA256SUMS
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: fedora:43
    env:
      LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
      LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
    steps:
      - name: Install container prerequisites
        run: >-
          dnf -y install git tar gzip xz curl findutils diffutils binutils
          rpm-build gnupg2

      - uses: actions/checkout@v7

      - name: Install Temurin JDK 25
        run: |
          curl -fsSL "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse" \
            -o /tmp/jdk.tar.gz
          mkdir -p /opt/jdk
          tar -xzf /tmp/jdk.tar.gz -C /opt/jdk --strip-components=1
          echo "JAVA_HOME=/opt/jdk" >> "$GITHUB_ENV"
          echo "/opt/jdk/bin" >> "$GITHUB_PATH"

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o /usr/local/bin/lein
          chmod +x /usr/local/bin/lein

      - name: Build .rpm
        working-directory: desktop
        run: bash scripts/build_rpm.sh

      - name: Inspect package
        working-directory: desktop
        run: |
          rpm -qpi target/rpm/RPMS/*/*.rpm
          rpm -qpR target/rpm/RPMS/*/*.rpm

      - name: Publish package, checksums and optional signature
        working-directory: desktop
        run: bash scripts/publish_linux.sh target/rpm/RPMS/*/*.rpm

      - name: Upload .rpm release
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parens-rpm-release
          path: desktop/target/dist/*
          if-no-files-found: ignore
