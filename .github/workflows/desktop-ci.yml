name: Desktop runtime

on:
  push:
    branches: [main, master]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"

env:
  LEIN_VERSION: "2.12.0"

jobs:
  handler-and-worker:
    name: Security boundary + worker recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      # project.clj refuses any JDK other than 25, so this is the pinned build.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run API and worker tests
        run: lein test

  deb:
    name: Ubuntu .deb
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install packaging prerequisites
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Build .deb
        run: bash scripts/build_deb.sh

      - name: Inspect package
        run: dpkg-deb -I target/deb/*.deb

      # Every published build carries a checksum a user can verify before
      # installing. publish_linux.sh also signs SHA256SUMS when a key is set,
      # which pull-request CI (and contributor builds) do not have.
      - name: Publish package with SHA256SUMS
        run: bash scripts/publish_linux.sh target/deb/*.deb

      - name: Install package
        run: sudo dpkg -i target/deb/*.deb

      - name: Check installed package
        run: >-
          node scripts/phase0_check.mjs
          --command /usr/bin/parens
          --json "$RUNNER_TEMP/deb-results.json"

      # The installed package must carry every asset the UI references: no CDN,
      # no first-run download. Crawls the shipped HTML/CSS and evaluates code.
      - name: Offline smoke (installed .deb)
        run: >-
          node scripts/offline_smoke.mjs
          --command /usr/bin/parens
          --json "$RUNNER_TEMP/deb-offline.json"

      - name: Uninstall package
        if: always()
        run: sudo dpkg -r parens || true

      - name: Upload .deb
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parens-deb
          path: desktop/target/dist/*
          if-no-files-found: ignore

      - name: Upload .deb check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deb-results
          path: ${{ runner.temp }}/deb-results.json
          if-no-files-found: ignore

  fedora-rpm:
    name: Fedora 43 .rpm
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: fedora:43
    steps:
      # The Fedora base image has no git, so install it before checkout. The
      # rest is the toolchain the RPM build and the checker need.
      - name: Install container prerequisites
        run: >-
          dnf -y install git tar gzip xz curl findutils diffutils binutils
          rpm-build nodejs

      - uses: actions/checkout@v7

      - name: Install Temurin JDK 25
        run: |
          curl -fsSL "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse" \
            -o /tmp/jdk.tar.gz
          mkdir -p /opt/jdk
          tar -xzf /tmp/jdk.tar.gz -C /opt/jdk --strip-components=1
          echo "JAVA_HOME=/opt/jdk" >> "$GITHUB_ENV"
          echo "/opt/jdk/bin" >> "$GITHUB_PATH"

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o /usr/local/bin/lein
          chmod +x /usr/local/bin/lein

      - name: Run API and worker tests
        working-directory: desktop
        run: lein test

      - name: Build .rpm
        working-directory: desktop
        run: bash scripts/build_rpm.sh

      - name: Inspect package
        working-directory: desktop
        run: |
          rpm -qpi target/rpm/RPMS/*/*.rpm
          rpm -qpR target/rpm/RPMS/*/*.rpm

      - name: Publish package with SHA256SUMS
        working-directory: desktop
        run: bash scripts/publish_linux.sh target/rpm/RPMS/*/*.rpm

      - name: Install package
        working-directory: desktop
        run: rpm -ivh target/rpm/RPMS/*/*.rpm

      - name: Check installed package
        working-directory: desktop
        run: >-
          node scripts/phase0_check.mjs
          --command /usr/bin/parens
          --json "$RUNNER_TEMP/rpm-results.json"

      - name: Offline smoke (installed .rpm)
        working-directory: desktop
        run: >-
          node scripts/offline_smoke.mjs
          --command /usr/bin/parens
          --json "$RUNNER_TEMP/rpm-offline.json"

      - name: Erase package
        if: always()
        run: rpm -e parens || true

      - name: Upload .rpm
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parens-rpm
          path: desktop/target/dist/*
          if-no-files-found: ignore

      - name: Upload .rpm check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpm-results
          path: ${{ runner.temp }}/rpm-results.json
          if-no-files-found: ignore

  linux-checksums:
    name: Linux checksums + GPG signature
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - name: Install GPG
        run: sudo apt-get update && sudo apt-get install -y gnupg

      # Release signing uses the real key in desktop-release.yml. This job
      # exercises the same path with a throwaway key on every pull request, so
      # a broken publisher fails before a release does.
      - name: Publish, sign and verify
        run: |
          set -euo pipefail

          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 0700 "$GNUPGHOME"
          printf '%s\n' \
            '%no-protection' \
            'Key-Type: RSA' \
            'Key-Length: 3072' \
            'Name-Real: Parens CI' \
            'Name-Email: ci@example.invalid' \
            'Expire-Date: 1d' \
            '%commit' > "$RUNNER_TEMP/key.batch"
          gpg --batch --gen-key "$RUNNER_TEMP/key.batch"
          gpg --batch --armor --export-secret-keys > "$RUNNER_TEMP/key.asc"
          gpg --batch --armor --export > "$RUNNER_TEMP/key.pub.asc"

          # The publisher only hashes whatever it is given; the package itself
          # is built and installed by the deb/rpm jobs above.
          mkdir -p "$RUNNER_TEMP/pkgs"
          printf 'fake package\n' > "$RUNNER_TEMP/pkgs/parens_0.1.0_amd64.deb"

          LINUX_GPG_PRIVATE_KEY_BASE64="$(base64 -w0 "$RUNNER_TEMP/key.asc")" \
            bash scripts/publish_linux.sh "$RUNNER_TEMP/pkgs/parens_0.1.0_amd64.deb"

          test -f target/dist/SHA256SUMS.asc
          (cd target/dist && sha256sum -c SHA256SUMS)

          # Verify the way a user does: a keyring holding only the public key.
          VERIFY_HOME="$RUNNER_TEMP/verify-home"
          mkdir -m 0700 -p "$VERIFY_HOME"
          GNUPGHOME="$VERIFY_HOME" gpg --batch --import "$RUNNER_TEMP/key.pub.asc"
          GNUPGHOME="$VERIFY_HOME" gpg --batch --verify \
            target/dist/SHA256SUMS.asc target/dist/SHA256SUMS

          # A package that no longer matches its checksum must be detected, and
          # signing must refuse to attach a fresh signature to stale sums.
          printf 'tampered\n' >> target/dist/parens_0.1.0_amd64.deb
          if (cd target/dist && sha256sum -c SHA256SUMS >/dev/null 2>&1); then
            echo "tampered package passed the checksum check" >&2
            exit 1
          fi
          if LINUX_GPG_PRIVATE_KEY_BASE64="$(base64 -w0 "$RUNNER_TEMP/key.asc")" \
            bash scripts/sign_linux.sh target/dist >/dev/null 2>&1; then
            echo "signing accepted tampered packages" >&2
            exit 1
          fi
          echo "Checksum and signature checks behaved as expected."

  app-image:
    name: Linux app-image (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest migrates to 26.04 during October–November 2026; test
        # both images now so that migration cannot change the result silently.
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install jpackage prerequisites
        run: sudo apt-get update && sudo apt-get install -y binutils

      # This is the standard-distribution path: no Nix zlib bundling happens
      # here. jpackage still strips bin/java, so the script copies the JDK's.
      - name: Build app image
        run: bash scripts/build_appimage.sh

      - name: Check app image
        run: >-
          node scripts/phase0_check.mjs
          --command "$(pwd)/target/jpackage/ParensPhase0/bin/ParensPhase0"
          --json "$RUNNER_TEMP/appimage-results.json"

      - name: Offline smoke (app image)
        run: >-
          node scripts/offline_smoke.mjs
          --command "$(pwd)/target/jpackage/ParensPhase0/bin/ParensPhase0"
          --json "$RUNNER_TEMP/appimage-offline.json"

      - name: Upload app-image results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-results-${{ matrix.os }}
          path: ${{ runner.temp }}/appimage-results.json
          if-no-files-found: ignore

  uberjar:
    name: Uberjar (shared with Windows)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # jpackage cannot cross-build, but the jar it packages is portable. Build
      # it once here so the Windows job does not need Leiningen under Git Bash.
      - name: Build uberjar
        run: lein uberjar

      - name: Upload uberjar
        uses: actions/upload-artifact@v7
        with:
          name: parens-uberjar
          path: desktop/target/parens-desktop.jar
          if-no-files-found: error

  macos-app-image:
    name: macOS app-image + .dmg
    runs-on: macos-latest
    # App image, the full check, then the dmg install and a second full check.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # jpackage on macOS rejects a version whose first component is zero,
      # which 0.1.0 is.
      - name: Build app image
        env:
          APP_VERSION: "1.0.0"
        run: bash scripts/build_appimage.sh

      - name: Check app image
        run: >-
          node scripts/phase0_check.mjs
          --command "$(pwd)/target/jpackage/ParensPhase0.app/Contents/MacOS/ParensPhase0"
          --json "$RUNNER_TEMP/appimage-macos-results.json"

      - name: Offline smoke (app image)
        run: >-
          node scripts/offline_smoke.mjs
          --command "$(pwd)/target/jpackage/ParensPhase0.app/Contents/MacOS/ParensPhase0"
          --json "$RUNNER_TEMP/appimage-macos-offline.json"

      - name: Upload macOS app-image results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-results-macos
          path: ${{ runner.temp }}/appimage-macos-results.json
          if-no-files-found: ignore

      # Package the image that just passed, rather than letting jpackage build
      # a second, unsigned one. build_dmg.sh adds the /Applications symlink.
      - name: Build .dmg
        env:
          APP_VERSION: "1.0.0"
          SKIP_APPIMAGE: "1"
        run: bash scripts/build_dmg.sh

      - name: Install .dmg
        run: |
          set -euo pipefail
          DMG=$(find target/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          if [ -z "$DMG" ]; then echo "no .dmg found" >&2; exit 1; fi
          MOUNT="$RUNNER_TEMP/parens-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
          sudo rm -rf /Applications/ParensPhase0.app
          sudo ditto "$MOUNT/ParensPhase0.app" /Applications/ParensPhase0.app
          hdiutil detach "$MOUNT" >/dev/null

      - name: Check installed app
        run: >-
          node scripts/phase0_check.mjs
          --command /Applications/ParensPhase0.app/Contents/MacOS/ParensPhase0
          --json "$RUNNER_TEMP/dmg-macos-results.json"

      - name: Offline smoke (installed .dmg)
        run: >-
          node scripts/offline_smoke.mjs
          --command /Applications/ParensPhase0.app/Contents/MacOS/ParensPhase0
          --json "$RUNNER_TEMP/dmg-macos-offline.json"

      - name: Uninstall app
        if: always()
        run: |
          hdiutil detach "$RUNNER_TEMP/parens-dmg" 2>/dev/null || true
          sudo rm -rf /Applications/ParensPhase0.app

      - name: Upload .dmg
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parens-dmg
          path: desktop/target/dmg/*.dmg
          if-no-files-found: ignore

      - name: Upload .dmg check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dmg-results-macos
          path: ${{ runner.temp }}/dmg-macos-results.json
          if-no-files-found: ignore

  windows-app-image:
    name: Windows app-image + .msi + .exe
    needs: uberjar
    runs-on: windows-latest
    # App image check, then an install/check/uninstall cycle for each of the
    # MSI and EXE installers (each builds its own runtime).
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: parens-uberjar
          path: desktop/target

      # The Windows runner's shell is PowerShell, but the build script is bash
      # (Git Bash is preinstalled). REBUILD_JAR=0 uses the shared uberjar.
      - name: Build app image
        shell: bash
        env:
          APP_VERSION: "1.0.0"
        run: REBUILD_JAR=0 bash scripts/build_appimage.sh

      - name: Check app image
        shell: bash
        run: >-
          node scripts/phase0_check.mjs
          --command "target/jpackage/ParensPhase0/ParensPhase0.exe"
          --json "$RUNNER_TEMP/appimage-windows-results.json"

      - name: Offline smoke (app image)
        shell: bash
        run: >-
          node scripts/offline_smoke.mjs
          --command "target/jpackage/ParensPhase0/ParensPhase0.exe"
          --json "$RUNNER_TEMP/appimage-windows-offline.json"

      - name: Upload Windows app-image results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-results-windows
          path: ${{ runner.temp }}/appimage-windows-results.json
          if-no-files-found: ignore

      # jpackage needs candle.exe/light.exe for an .msi. The windows images
      # usually carry WiX 3.x; install it through Chocolatey when they do not.
      - name: Ensure WiX Toolset
        shell: pwsh
        run: |
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'bin\candle.exe') } |
            Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset --yes --no-progress
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*" -Directory |
              Where-Object { Test-Path (Join-Path $_.FullName 'bin\candle.exe') } |
              Select-Object -First 1
          }
          if (-not $wix) { throw 'WiX Toolset is not installed' }
          $bin = Join-Path $wix.FullName 'bin'
          Write-Host "WiX: $bin"
          # jpackage finds candle.exe/light.exe on PATH.
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build .msi
        shell: bash
        env:
          APP_VERSION: "1.0.0"
          REBUILD_JAR: "0"
        run: bash scripts/build_msi.sh

      - name: Install .msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem target\msi\*.msi | Select-Object -First 1
          if (-not $msi) { throw 'no .msi found' }
          $log = Join-Path $env:RUNNER_TEMP 'msi-install.log'
          $p = Start-Process msiexec.exe -ArgumentList @(
            '/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/L*v', "`"$log`""
          ) -Wait -PassThru
          # 3010 means success with a pending reboot.
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            Get-Content $log -Tail 80
            throw "msiexec install failed ($($p.ExitCode))"
          }
          Write-Host "Installed $($msi.Name)"

      - name: Locate installed launcher
        id: installed
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:ProgramFiles 'ParensPhase0\ParensPhase0.exe'),
            (Join-Path $env:LOCALAPPDATA 'ParensPhase0\ParensPhase0.exe')
          )
          # msiexec can return before the files are on disk; give it time.
          $deadline = (Get-Date).AddSeconds(90)
          do {
            $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($exe) { break }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)
          if (-not $exe) {
            Get-ChildItem $env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:LOCALAPPDATA `
              -Filter ParensPhase0.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 5 | ForEach-Object { Write-Host $_.FullName }
            throw 'installed ParensPhase0.exe not found'
          }
          # The child evaluator runs from the bundled java.exe when jpackage
          # kept it, or from the ParensWorker launcher next to the app when the
          # runtime was stripped. Fail here with a clear message if neither is
          # present; the checker then proves the worker really starts.
          $appDir = Split-Path $exe
          $javaExe = Join-Path $appDir 'runtime\bin\java.exe'
          $workerExe = Join-Path $appDir 'ParensWorker.exe'
          if (-not (Test-Path $javaExe) -and -not (Test-Path $workerExe)) {
            throw "installed app has neither runtime\bin\java.exe nor ParensWorker.exe"
          }
          # Forward slashes keep Git Bash from rewriting the path.
          "exe=$($exe.Replace('\', '/'))" >> $env:GITHUB_OUTPUT
          Write-Host "Installed launcher: $exe"

      - name: Check installed app
        shell: bash
        run: >-
          node scripts/phase0_check.mjs
          --command "${{ steps.installed.outputs.exe }}"
          --json "$RUNNER_TEMP/msi-windows-results.json"

      - name: Offline smoke (installed .msi)
        shell: bash
        run: >-
          node scripts/offline_smoke.mjs
          --command "${{ steps.installed.outputs.exe }}"
          --json "$RUNNER_TEMP/msi-windows-offline.json"

      - name: Uninstall .msi
        if: always()
        shell: pwsh
        run: |
          $msi = Get-ChildItem target\msi\*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            $p = Start-Process msiexec.exe -ArgumentList @(
              '/x', "`"$($msi.FullName)`"", '/qn', '/norestart'
            ) -Wait -PassThru
            Write-Host "msiexec uninstall exit $($p.ExitCode)"
            $exe = '${{ steps.installed.outputs.exe }}'
            if ($exe -and (Test-Path $exe)) {
              throw "uninstall left $exe behind"
            }
          }

      - name: Upload .msi
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parens-msi
          path: desktop/target/msi/*.msi
          if-no-files-found: ignore

      - name: Upload .msi check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msi-results-windows
          path: ${{ runner.temp }}/msi-windows-results.json
          if-no-files-found: ignore

      - name: Build .exe
        shell: bash
        env:
          APP_VERSION: "1.0.0"
          REBUILD_JAR: "0"
        run: bash scripts/build_exe.sh

      # jpackage's .exe embeds an MSI and forwards its arguments to
      # `msiexec /i`, so /quiet installs it silently.
      - name: Install .exe
        id: installed_exe
        shell: pwsh
        run: |
          $installer = Get-ChildItem target\exe\*.exe | Select-Object -First 1
          if (-not $installer) { throw 'no .exe installer found' }
          $p = Start-Process $installer.FullName -ArgumentList '/quiet', '/norestart' -PassThru
          if (-not $p.WaitForExit(600000)) { throw '.exe install did not finish' }
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw ".exe install failed ($($p.ExitCode))"
          }
          Write-Host "Installed $($installer.Name)"
          $candidates = @(
            (Join-Path $env:ProgramFiles 'ParensPhase0\ParensPhase0.exe'),
            (Join-Path $env:LOCALAPPDATA 'ParensPhase0\ParensPhase0.exe')
          )
          $deadline = (Get-Date).AddSeconds(90)
          do {
            $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($exe) { break }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)
          if (-not $exe) { throw 'installed ParensPhase0.exe not found' }
          $appDir = Split-Path $exe
          $javaExe = Join-Path $appDir 'runtime\bin\java.exe'
          $workerExe = Join-Path $appDir 'ParensWorker.exe'
          if (-not (Test-Path $javaExe) -and -not (Test-Path $workerExe)) {
            throw "installed app has neither runtime\bin\java.exe nor ParensWorker.exe"
          }
          "exe=$($exe.Replace('\', '/'))" >> $env:GITHUB_OUTPUT
          Write-Host "Installed launcher: $exe"

      - name: Check installed app (.exe)
        shell: bash
        run: >-
          node scripts/phase0_check.mjs
          --command "${{ steps.installed_exe.outputs.exe }}"
          --json "$RUNNER_TEMP/exe-windows-results.json"

      - name: Offline smoke (installed .exe)
        shell: bash
        run: >-
          node scripts/offline_smoke.mjs
          --command "${{ steps.installed_exe.outputs.exe }}"
          --json "$RUNNER_TEMP/exe-windows-offline.json"

      - name: Uninstall .exe
        if: always()
        shell: pwsh
        run: |
          $installer = Get-ChildItem target\exe\*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            # A bare `uninstall` argument makes the wrapper remove the product
            # silently using the product code embedded in it.
            $p = Start-Process $installer.FullName -ArgumentList 'uninstall' -PassThru
            if (-not $p.WaitForExit(600000)) { throw '.exe uninstall did not finish' }
            Write-Host "uninstall exit $($p.ExitCode)"
            $exe = '${{ steps.installed_exe.outputs.exe }}'
            $deadline = (Get-Date).AddSeconds(60)
            while ($exe -and (Test-Path $exe) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 3
            }
            if ($exe -and (Test-Path $exe)) { throw "uninstall left $exe behind" }
          }

      - name: Upload .exe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parens-exe
          path: desktop/target/exe/*.exe
          if-no-files-found: ignore

      - name: Upload .exe check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exe-results-windows
          path: ${{ runner.temp }}/exe-windows-results.json
          if-no-files-found: ignore

  end-to-end:
    name: End-to-end checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build uberjar
        run: lein uberjar

      # Drives the real server over loopback: token, Host, Origin, fetch-site,
      # timeout kill/restart, System/exit recovery, and orphan cleanup.
      - name: Run Phase 0 checker
        run: node scripts/phase0_check.mjs --json "$RUNNER_TEMP/phase0-results.json"

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase0-results
          path: ${{ runner.temp }}/phase0-results.json
          if-no-files-found: ignore
