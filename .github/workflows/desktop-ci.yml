name: Desktop runtime

on:
  push:
    branches: [main, master]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"

env:
  LEIN_VERSION: "2.12.0"

jobs:
  handler-and-worker:
    name: Security boundary + worker recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      # project.clj refuses any JDK other than 25, so this is the pinned build.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run API and worker tests
        run: lein test

  deb:
    name: Ubuntu .deb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install packaging prerequisites
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Build .deb
        run: bash scripts/build_deb.sh

      - name: Inspect package
        run: dpkg-deb -I target/deb/*.deb

      - name: Install package
        run: sudo dpkg -i target/deb/*.deb

      - name: Check installed package
        run: >-
          node scripts/phase0_check.mjs
          --command /usr/bin/parens
          --json "$RUNNER_TEMP/deb-results.json"

      - name: Uninstall package
        if: always()
        run: sudo dpkg -r parens || true

      - name: Upload .deb
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parens-deb
          path: desktop/target/deb/*.deb
          if-no-files-found: ignore

      - name: Upload .deb check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deb-results
          path: ${{ runner.temp }}/deb-results.json
          if-no-files-found: ignore

  fedora-rpm:
    name: Fedora 43 .rpm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: fedora:43
    steps:
      # The Fedora base image has no git, so install it before checkout. The
      # rest is the toolchain the RPM build and the checker need.
      - name: Install container prerequisites
        run: >-
          dnf -y install git tar gzip xz curl findutils diffutils binutils
          rpm-build nodejs

      - uses: actions/checkout@v7

      - name: Install Temurin JDK 25
        run: |
          curl -fsSL "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse" \
            -o /tmp/jdk.tar.gz
          mkdir -p /opt/jdk
          tar -xzf /tmp/jdk.tar.gz -C /opt/jdk --strip-components=1
          echo "JAVA_HOME=/opt/jdk" >> "$GITHUB_ENV"
          echo "/opt/jdk/bin" >> "$GITHUB_PATH"

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o /usr/local/bin/lein
          chmod +x /usr/local/bin/lein

      - name: Run API and worker tests
        working-directory: desktop
        run: lein test

      - name: Build .rpm
        working-directory: desktop
        run: bash scripts/build_rpm.sh

      - name: Inspect package
        working-directory: desktop
        run: |
          rpm -qpi target/rpm/RPMS/*/*.rpm
          rpm -qpR target/rpm/RPMS/*/*.rpm

      - name: Install package
        working-directory: desktop
        run: rpm -ivh target/rpm/RPMS/*/*.rpm

      - name: Check installed package
        working-directory: desktop
        run: >-
          node scripts/phase0_check.mjs
          --command /usr/bin/parens
          --json "$RUNNER_TEMP/rpm-results.json"

      - name: Erase package
        if: always()
        run: rpm -e parens || true

      - name: Upload .rpm
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parens-rpm
          path: desktop/target/rpm/RPMS/*/*.rpm
          if-no-files-found: ignore

      - name: Upload .rpm check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpm-results
          path: ${{ runner.temp }}/rpm-results.json
          if-no-files-found: ignore

  app-image:
    name: Linux app-image (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest migrates to 26.04 during October–November 2026; test
        # both images now so that migration cannot change the result silently.
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install jpackage prerequisites
        run: sudo apt-get update && sudo apt-get install -y binutils

      # This is the standard-distribution path: no Nix zlib bundling happens
      # here. jpackage still strips bin/java, so the script copies the JDK's.
      - name: Build app image
        run: bash scripts/build_appimage.sh

      - name: Check app image
        run: >-
          node scripts/phase0_check.mjs
          --command "$(pwd)/target/jpackage/ParensPhase0/bin/ParensPhase0"
          --json "$RUNNER_TEMP/appimage-results.json"

      - name: Upload app-image results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-results-${{ matrix.os }}
          path: ${{ runner.temp }}/appimage-results.json
          if-no-files-found: ignore

  uberjar:
    name: Uberjar (shared with Windows)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # jpackage cannot cross-build, but the jar it packages is portable. Build
      # it once here so the Windows job does not need Leiningen under Git Bash.
      - name: Build uberjar
        run: lein uberjar

      - name: Upload uberjar
        uses: actions/upload-artifact@v7
        with:
          name: parens-uberjar
          path: desktop/target/parens-desktop.jar
          if-no-files-found: error

  macos-app-image:
    name: macOS app-image
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # jpackage on macOS rejects a version whose first component is zero,
      # which 0.1.0 is.
      - name: Build app image
        env:
          APP_VERSION: "1.0.0"
        run: bash scripts/build_appimage.sh

      - name: Check app image
        run: >-
          node scripts/phase0_check.mjs
          --command "$(pwd)/target/jpackage/ParensPhase0.app/Contents/MacOS/ParensPhase0"
          --json "$RUNNER_TEMP/appimage-macos-results.json"

      - name: Upload macOS app-image results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-results-macos
          path: ${{ runner.temp }}/appimage-macos-results.json
          if-no-files-found: ignore

  windows-app-image:
    name: Windows app-image
    needs: uberjar
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: parens-uberjar
          path: desktop/target

      # The Windows runner's shell is PowerShell, but the build script is bash
      # (Git Bash is preinstalled). REBUILD_JAR=0 uses the shared uberjar.
      - name: Build app image
        shell: bash
        env:
          APP_VERSION: "1.0.0"
        run: REBUILD_JAR=0 bash scripts/build_appimage.sh

      - name: Check app image
        shell: bash
        run: >-
          node scripts/phase0_check.mjs
          --command "target/jpackage/ParensPhase0/ParensPhase0.exe"
          --json "$RUNNER_TEMP/appimage-windows-results.json"

      - name: Upload Windows app-image results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-results-windows
          path: ${{ runner.temp }}/appimage-windows-results.json
          if-no-files-found: ignore

  end-to-end:
    name: End-to-end checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build uberjar
        run: lein uberjar

      # Drives the real server over loopback: token, Host, Origin, fetch-site,
      # timeout kill/restart, System/exit recovery, and orphan cleanup.
      - name: Run Phase 0 checker
        run: node scripts/phase0_check.mjs --json "$RUNNER_TEMP/phase0-results.json"

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase0-results
          path: ${{ runner.temp }}/phase0-results.json
          if-no-files-found: ignore
